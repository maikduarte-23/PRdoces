services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # Mapeia a porta 3050 do seu PC para a porta 3000 do container
    ports:
      - "3050:3000" 
    # Carrega automaticamente as variáveis do seu arquivo .env.local
    env_file:
      - .env
    # Volumes permitem o "Hot Reload" (atualização em tempo real)
    volumes:
      - .:/app
      - node_modules_frontend:/app/node_modules
      - /app/backend # Evita que o frontend "enxergue" mudanças nos arquivos do backend
    # Mantém o container rodando caso dê algum erro não crítico
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      # Essencial para o backend encontrar o banco na rede do Docker
      - POSTGRES_HOST=banco_de_dados
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      banco_de_dados:
        condition: service_healthy

  banco_de_dados:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: pr_doces
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pr_doces"]
      interval: 5s
      timeout: 5s
      retries: 5

  tailscale:
    image: tailscale/tailscale:latest
    hostname: pr-doces-vpn
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./serve.json:/config/serve.json
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

volumes:
  postgres_data:
  tailscale_data:
  node_modules_frontend: